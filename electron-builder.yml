appId: com.deepseekai.dsh.desktop
productName: DeepSeek Harness Desktop
directories:
  output: out
electronDist: node_modules/electron/dist
asar: false
files:
  - "src/**"
  - "build/**"
  - "package.json"
extraResources:
  - from: vendor/node_modules
    to: app/node_modules
  - from: build/icon.ico
    to: appicon.ico
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DeepSeek Harness Desktop
  include: build/installer.nsh
